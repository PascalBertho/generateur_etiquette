<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur d'étiquettes</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#182838;--soft:#607284;--line:#d7e0e7;--panel:#f4f7f9;--accent:#0f5f8c;--accent2:#e8722a}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--panel);color:var(--ink)}
header{height:64px;padding:0 24px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px} header h1{font-size:19px;margin:0} header .spacer{flex:1}
button,select,input{font:inherit}.btn{border:0;border-radius:7px;padding:9px 14px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:#fff}.accent{background:var(--accent2);color:#fff}.outline{background:#fff;color:var(--accent);border:1px solid var(--accent)}
main{width:100%;padding:18px 22px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) minmax(260px,1.4fr) auto auto auto;gap:12px;align-items:end}.field label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}.field select,.field input{width:100%;height:39px;border:1px solid #9fb0bd;border-radius:7px;padding:0 10px;background:#fff;color:var(--ink)}
.status{margin-top:10px;font-size:12px;color:var(--soft)}.summary{margin-top:10px;display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap}.summary strong{color:var(--accent)}.pagination{margin-left:auto;display:flex;align-items:center;gap:7px}.pagination .btn{padding:6px 10px;font-size:12px}.pagination .btn:disabled{opacity:.45;cursor:not-allowed}.page-info{min-width:190px;text-align:center;font-size:12px;color:var(--soft);font-weight:650}
.table-wrap{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px)}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:1500px}thead th{position:sticky;top:0;z-index:3;background:#eaf0f4;color:#405565;text-align:left;padding:9px 8px;border-bottom:1px solid #b9c6cf;white-space:nowrap;cursor:pointer}.sort-mark{font-size:10px;margin-left:4px;color:var(--accent)}tbody td{padding:7px 8px;border-bottom:1px solid #edf1f4;vertical-align:middle}tbody tr:hover{background:#f7fafc}tbody tr.selected{background:#edf6fb}.check-col{width:34px;text-align:center}.ref{font-weight:750;color:var(--accent);white-space:nowrap}.price{text-align:right;white-space:nowrap}.barcode-text{font-family:Consolas,monospace;white-space:nowrap}.barcode-preview svg{max-width:150px;height:42px}.photo-cell{min-width:125px;white-space:nowrap;font-family:Consolas,monospace;font-size:11px}.photo-missing{font-family:inherit;font-size:11px;color:#8998a5}.muted{color:#8998a5}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Générateur d'étiquettes produit</h1>
  <div class="spacer"></div>
  <button class="btn outline" id="logoutBtn">Se déconnecter</button>
</header>
<main>
  <section class="toolbar">
    <div class="filters">
      <div class="field"><label>Activité DS</label><select id="filterSecteur"><option value="Tous">Tous</option></select></div>
      <div class="field"><label>Groupe</label><select id="filterGroupe"><option value="Tous">Tous</option></select></div>
      <div class="field wide"><label>Recherche article</label><input id="articleSearch" type="search" placeholder="Référence DS, famille ou libellé"></div>
      <button class="btn primary" id="refreshBtn">Actualiser</button>
      <button class="btn outline" id="photoBtn">Photo</button>
      <button class="btn accent" id="previewBtn">Ouvrir l'aperçu des étiquettes</button>
    </div>
    <div class="summary">
      <button class="btn outline" id="selectPageBtn">Sélectionner les 500 affichés</button>
      <span><strong id="filteredCount">0</strong> article(s) dans la liste</span>
      <span><strong id="displayedCount">0</strong> affiché(s)</span>
      <span id="selectionCount">0 article sélectionné</span>
      <button class="btn outline" id="clearSelectionBtn">Vider la sélection</button>
      <div class="pagination">
        <button class="btn outline" id="firstPageBtn" title="Première page">« Première</button>
        <button class="btn outline" id="prevPageBtn" title="Page précédente">‹ Précédente</button>
        <span class="page-info" id="pageInfo">Page 1 / 1</span>
        <button class="btn outline" id="nextPageBtn" title="Page suivante">Suivante ›</button>
        <button class="btn outline" id="lastPageBtn" title="Dernière page">Dernière »</button>
      </div>
    </div>
    <div class="status" id="status">Chargement des activités…</div>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
      <tr>
        <th class="check-col"></th>
        <th data-sort="numero">Référence DS</th><th data-sort="refFournisseur">Référence fournisseur</th><th data-sort="groupe">Groupe</th><th data-sort="famille">Famille</th><th data-sort="libelle">Libellé</th><th data-sort="secteur">Secteur</th><th data-sort="prix">Prix</th><th data-sort="barcode">Code à barre</th><th>Aperçu code barre</th><th data-sort="photo">Photo actuelle</th>
      </tr>
      </thead>
      <tbody id="articlesBody"></tbody>
    </table>
  </section>
</main>
<script>
const STATE_KEY='generateur_etiquettes_state';
let articles=[];
const selected=new Set();
const selectedArticles=new Map();
let timer=null;
let restoreState=null;
let sortKey='numero', sortDir='asc';
const PAGE_SIZE=500;
let apiController=null;
let currentPage=1, totalPages=1, totalArticles=0;


function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function lireEtat(){
  try{return JSON.parse(sessionStorage.getItem(STATE_KEY)||'{}')||{}}catch{return {}}
}
function enregistrerEtat(){
  const lignesSelectionnees=[...selectedArticles.values()].filter(a=>selected.has(String(a.numero)));
  sessionStorage.setItem(STATE_KEY,JSON.stringify({
    activiteDs:filterSecteur.value,
    groupe:filterGroupe.value,
    recherche:articleSearch.value,
    page:currentPage,
    selected:[...selected],
    selectedRows:lignesSelectionnees
  }));
}
function restaurerSelection(){
  const etat=lireEtat();
  selected.clear();
  selectedArticles.clear();
  if(Array.isArray(etat.selected)) etat.selected.forEach(ref=>selected.add(String(ref)));
  if(Array.isArray(etat.selectedRows)){
    etat.selectedRows.forEach(article=>{
      const ref=String(article?.numero||'');
      if(ref && selected.has(ref)) selectedArticles.set(ref,article);
    });
  }
  currentPage=Math.max(1,Number(etat.page||1));
  restoreState=etat;
}
async function api(params){
  if(apiController) apiController.abort();
  const controller=new AbortController();
  apiController=controller;
  const q=new URLSearchParams(params);
  try{
    const r=await fetch('/api/articles?'+q,{credentials:'same-origin',cache:'no-store',signal:controller.signal});
    const p=await r.json().catch(()=>({}));
    if(r.status===401){location.href='/login';throw new Error('Session expirée')}
    if(!r.ok)throw new Error(p.error||'Erreur API');
    return p;
  }finally{
    if(apiController===controller) apiController=null;
  }
}
function fillSelect(el,values,desired){el.innerHTML='<option value="Tous">Tous</option>';for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}if(desired&&[...el.options].some(o=>o.value===desired))el.value=desired}
async function loadActivites(){try{status.textContent='Chargement des activités…';const p=await api({action:'secteurs'});fillSelect(filterSecteur,p.secteurs||[],restoreState?.activiteDs||'Tous');await loadGroupes(true)}catch(e){status.textContent='Erreur : '+e.message}}
async function loadGroupes(restoring=false){try{status.textContent='Chargement des groupes…';const p=await api({action:'groupes',activite_ds:filterSecteur.value});fillSelect(filterGroupe,p.groupes||[],restoring?(restoreState?.groupe||'Tous'):'Tous');if(restoring&&restoreState?.recherche)articleSearch.value=restoreState.recherche;await loadArticles();restoreState=null}catch(e){status.textContent='Erreur : '+e.message}}
async function loadArticles(){try{status.textContent='Chargement des articles…';const params={action:'articles',activite_ds:filterSecteur.value,groupe:filterGroupe.value,page:String(currentPage),page_size:String(PAGE_SIZE)};if(articleSearch.value.trim())params.q=articleSearch.value.trim();const p=await api(params);articles=Array.isArray(p.articles)?p.articles:[];totalArticles=Number(p.total||0);totalPages=Math.max(1,Number(p.totalPages||1));currentPage=Math.min(Math.max(1,Number(p.page||currentPage)),totalPages);render();const debut=totalArticles?((currentPage-1)*PAGE_SIZE+1):0;const fin=totalArticles?Math.min(currentPage*PAGE_SIZE,totalArticles):0;status.textContent=totalArticles?`${debut}–${fin} sur ${totalArticles} article(s).`:'Aucun article.';majPagination();enregistrerEtat()}catch(e){if(e?.name==='AbortError')return;articles=[];totalArticles=0;totalPages=1;currentPage=1;render();majPagination();status.textContent='Erreur : '+e.message}}

function valeurColonne(a,key){return String(a?.[key]??'').trim()}
function articlesAffiches(){
  let rows=articles.slice();
  rows=rows.slice().sort((a,b)=>{
    let av=valeurColonne(a,sortKey), bv=valeurColonne(b,sortKey);
    if(sortKey==='prix'){av=parseFloat(av.replace(',','.'))||0;bv=parseFloat(bv.replace(',','.'))||0;return (av-bv)*(sortDir==='asc'?1:-1)}
    return av.localeCompare(bv,'fr',{numeric:true,sensitivity:'base'})*(sortDir==='asc'?1:-1);
  });
  return rows;
}
function majFiltresColonnes(){
}
function photoHtml(a){
  const nom=String(a.photo || '').trim();
  return nom
    ? `<div class="photo-cell">${esc(nom)}</div>`
    : `<span class="photo-missing">Aucune</span>`;
}
function render(){
  majFiltresColonnes();
  const rows=articlesAffiches();
  articles.forEach(a=>{if(selected.has(a.numero))selectedArticles.set(a.numero,a)});
  articlesBody.innerHTML=rows.map((a,i)=>`<tr data-i="${i}" class="${selected.has(a.numero)?'selected':''}"><td class="check-col"><input class="row-check" type="checkbox" data-ref="${esc(a.numero)}" ${selected.has(a.numero)?'checked':''}></td><td class="ref">${esc(a.numero)}</td><td>${esc(a.refFournisseur)||'<span class="muted">—</span>'}</td><td>${esc(a.groupe)||'—'}</td><td>${esc(a.famille)||'—'}</td><td>${esc(a.libelle)||'—'}</td><td>${esc(a.secteur)||'—'}</td><td class="price">${a.prix?esc(a.prix)+' €':'—'}</td><td class="barcode-text">${esc(a.barcode)||'—'}</td><td class="barcode-preview"><svg id="bc-${i}"></svg></td><td>${photoHtml(a)}</td></tr>`).join('');
  document.querySelectorAll('.row-check').forEach(cb=>cb.addEventListener('change',e=>{const ref=e.target.dataset.ref;const article=articles.find(a=>a.numero===ref);if(e.target.checked){
  if(selected.size>=500 && !selected.has(ref)){
    e.target.checked=false;
    alert('La sélection est limitée à 500 articles maximum.');
    return;
  }
  selected.add(ref);
  if(article)selectedArticles.set(ref,article);
}else{
  selected.delete(ref);
  selectedArticles.delete(ref);
}
enregistrerEtat();
render()}));
  rows.forEach((a,i)=>{if(!a.barcode)return;try{const val=a.barcodeType==='EAN13'&&/^\d{13}$/.test(a.barcode)?a.barcode.slice(0,12):a.barcode;JsBarcode('#bc-'+i,val,{format:a.barcodeType||'CODE128',displayValue:false,height:30,width:1,margin:2})}catch{}});
  document.querySelectorAll('th[data-sort]').forEach(th=>{th.querySelector('.sort-mark')?.remove();if(th.dataset.sort===sortKey)th.insertAdjacentHTML('beforeend',`<span class="sort-mark">${sortDir==='asc'?'▲':'▼'}</span>`)});
  updateCount();
}
document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir='asc'}render()}));
function updateCount(){
  selectionCount.textContent=selected.size+' article'+(selected.size>1?'s':'')+' sélectionné'+(selected.size>1?'s':'');
  filteredCount.textContent=totalArticles.toLocaleString('fr-BE');
  displayedCount.textContent=articles.length.toLocaleString('fr-BE');
  selectPageBtn.textContent=`Sélectionner les ${articles.length} affichés`;
} affichés`;
}
function majPagination(){
  const debut=totalArticles?((currentPage-1)*PAGE_SIZE+1):0;
  const fin=totalArticles?Math.min(currentPage*PAGE_SIZE,totalArticles):0;
  pageInfo.textContent=totalArticles?`Page ${currentPage} / ${totalPages} — ${debut} à ${fin}`:'Page 1 / 1';
  firstPageBtn.disabled=currentPage<=1;prevPageBtn.disabled=currentPage<=1;nextPageBtn.disabled=currentPage>=totalPages;lastPageBtn.disabled=currentPage>=totalPages;
}
async function allerPage(page){const cible=Math.min(totalPages,Math.max(1,page));if(cible===currentPage)return;currentPage=cible;enregistrerEtat();await loadArticles();document.querySelector('.table-wrap')?.scrollTo({top:0,behavior:'smooth'});}
filterSecteur.addEventListener('change',()=>{currentPage=1;filterGroupe.value='Tous';enregistrerEtat();loadGroupes(false)});
filterGroupe.addEventListener('change',()=>{currentPage=1;enregistrerEtat();loadArticles()});
refreshBtn.addEventListener('click',()=>{currentPage=1;loadArticles()});
articleSearch.addEventListener('input',()=>{
  
  currentPage=1;
  enregistrerEtat();
  clearTimeout(timer);
  const terme=articleSearch.value.trim();
  if(terme.length>0 && terme.length<3){
    status.textContent='Saisissez au moins 3 caractères pour lancer la recherche.';
    return;
  }
  timer=setTimeout(loadArticles,500);
});
articleSearch.addEventListener('keydown',(event)=>{
  if(event.key!=='Enter') return;
  event.preventDefault();
  clearTimeout(timer);
  const terme=articleSearch.value.trim();
  if(terme.length>0 && terme.length<3){
    status.textContent='Saisissez au moins 3 caractères pour lancer la recherche.';
    return;
  }
  currentPage=1;
  loadArticles();
});
selectPageBtn.addEventListener('click',()=>{
  selected.clear();
  selectedArticles.clear();
  articles.slice(0,500).forEach(a=>{
    selected.add(String(a.numero));
    selectedArticles.set(String(a.numero),a);
  });
  enregistrerEtat();
  render();
});
clearSelectionBtn.addEventListener('click',()=>{selected.clear();selectedArticles.clear();enregistrerEtat();render()});
firstPageBtn.addEventListener('click',()=>allerPage(1));
prevPageBtn.addEventListener('click',()=>allerPage(currentPage-1));
nextPageBtn.addEventListener('click',()=>allerPage(currentPage+1));
lastPageBtn.addEventListener('click',()=>allerPage(totalPages));
async function completerArticlesSelectionnes(){
  const manquants=[...selected].filter(ref=>!selectedArticles.has(String(ref)));
  for(const ref of manquants){
    try{
      const p=await api({action:'detail',numero:String(ref)});
      if(p?.article){
        const a=p.article;
        selectedArticles.set(String(a.refds||ref),{
          numero:String(a.refds||ref),refFournisseur:a.reffour||'',activiteDs:a.activiteDs||'',
          groupe:a.groupe||'',famille:a.famille||'',libelle:a.libelle||'',secteur:a.secteur||'',
          prix:a.prix||'',barcode:a.barcode||'',barcodeType:a.barcodeType||'CODE128',photo:a.photo||''
        });
      }
    }catch(e){console.warn('Détail article impossible',ref,e)}
  }
}

photoBtn.addEventListener('click',async()=>{
  articles.forEach(a=>{if(selected.has(a.numero))selectedArticles.set(a.numero,a)});
  if(!selected.size){
    alert('Sélectionnez au moins un article avant d’ouvrir la page Photo.');
    return;
  }
  status.textContent=`Préparation de ${selected.size} article(s) pour la page Photo…`;
  await completerArticlesSelectionnes();
  const lignesSelectionnees=[...selectedArticles.values()].filter(a=>selected.has(String(a.numero)));
  if(!lignesSelectionnees.length){
    alert('Sélectionnez au moins un article avant d’ouvrir la page Photo.');
    return;
  }
  enregistrerEtat();
  sessionStorage.setItem('photos_articles_liste', JSON.stringify(lignesSelectionnees));
  sessionStorage.setItem('photos_articles_contexte', JSON.stringify({
    activiteDs:filterSecteur.value,
    groupe:filterGroupe.value,
    recherche:articleSearch.value.trim(),
    selectionCount:lignesSelectionnees.length
  }));
  location.href='/generateur-etiquettes/photos.html';
});
previewBtn.addEventListener('click',async()=>{articles.forEach(a=>{if(selected.has(a.numero))selectedArticles.set(a.numero,a)});await completerArticlesSelectionnes();const rows=[...selectedArticles.values()].filter(a=>selected.has(a.numero));if(!rows.length){alert('Sélectionnez au moins un article.');return}enregistrerEtat();sessionStorage.setItem('etiquettes_selection',JSON.stringify(rows));window.open('/generateur-etiquettes/apercu.html','_blank')});
logoutBtn.addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}location.href='/login'});
restaurerSelection();
majPagination();
loadActivites();
</script>
</body></html>
