<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur d'étiquettes</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#182838;--soft:#607284;--line:#d7e0e7;--panel:#f4f7f9;--accent:#0f5f8c;--accent2:#e8722a}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--panel);color:var(--ink)}
header{height:64px;padding:0 24px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px} header h1{font-size:19px;margin:0} header .spacer{flex:1}
button,select,input{font:inherit}.btn{border:0;border-radius:7px;padding:9px 14px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:#fff}.accent{background:var(--accent2);color:#fff}.outline{background:#fff;color:var(--accent);border:1px solid var(--accent)}
main{width:100%;padding:18px 22px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) minmax(260px,1.4fr) auto auto auto;gap:12px;align-items:end}.field label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}.field select,.field input{width:100%;height:39px;border:1px solid #9fb0bd;border-radius:7px;padding:0 10px;background:#fff;color:var(--ink)}
.status{margin-top:10px;font-size:12px;color:var(--soft)}.summary{margin-top:10px;display:flex;align-items:center;gap:12px;font-size:13px}.summary strong{color:var(--accent)}
.table-wrap{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px)}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:1500px}thead th{position:sticky;top:0;z-index:3;background:#eaf0f4;color:#405565;text-align:left;padding:9px 8px;border-bottom:1px solid #b9c6cf;white-space:nowrap;cursor:pointer}.filter-row th{top:34px;z-index:2;padding:4px 5px;background:#f7fafc;cursor:default}.filter-row select{width:100%;min-width:90px;height:28px;border:1px solid #b8c6d0;border-radius:5px;background:#fff;font-size:11px;color:#405565}.sort-mark{font-size:10px;margin-left:4px;color:var(--accent)}tbody td{padding:7px 8px;border-bottom:1px solid #edf1f4;vertical-align:middle}tbody tr:hover{background:#f7fafc}tbody tr.selected{background:#edf6fb}.check-col{width:34px;text-align:center}.ref{font-weight:750;color:var(--accent);white-space:nowrap}.price{text-align:right;white-space:nowrap}.barcode-text{font-family:Consolas,monospace;white-space:nowrap}.barcode-preview svg{max-width:150px;height:42px}.photo-cell{min-width:125px;white-space:nowrap;font-family:Consolas,monospace;font-size:11px}.photo-missing{font-family:inherit;font-size:11px;color:#8998a5}.muted{color:#8998a5}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Générateur d'étiquettes produit</h1>
  <div class="spacer"></div>
  <button class="btn outline" id="logoutBtn">Se déconnecter</button>
</header>
<main>
  <section class="toolbar">
    <div class="filters">
      <div class="field"><label>Activité DS</label><select id="filterSecteur"><option value="Tous">Tous</option></select></div>
      <div class="field"><label>Groupe</label><select id="filterGroupe"><option value="Tous">Tous</option></select></div>
      <div class="field wide"><label>Recherche article</label><input id="articleSearch" type="search" placeholder="Référence DS, famille ou libellé"></div>
      <button class="btn primary" id="refreshBtn">Actualiser</button>
      <button class="btn outline" id="photoBtn">Photo</button>
      <button class="btn accent" id="previewBtn">Ouvrir l'aperçu des étiquettes</button>
    </div>
    <div class="summary">
      <label><input type="checkbox" id="selectAll"> <strong>Tous</strong></label>
      <span id="selectionCount">0 article sélectionné</span>
      <button class="btn outline" id="clearSelectionBtn">Vider la sélection</button>
    </div>
    <div class="status" id="status">Chargement des activités…</div>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
      <tr>
        <th class="check-col"></th>
        <th data-sort="numero">Référence DS</th><th data-sort="refFournisseur">Référence fournisseur</th><th data-sort="groupe">Groupe</th><th data-sort="famille">Famille</th><th data-sort="libelle">Libellé</th><th data-sort="secteur">Secteur</th><th data-sort="prix">Prix</th><th data-sort="barcode">Code à barre</th><th>Aperçu code barre</th><th data-sort="photo">Photo actuelle</th>
      </tr>
      <tr class="filter-row">
        <th></th><th><select data-filter="numero"></select></th><th><select data-filter="refFournisseur"></select></th><th><select data-filter="groupe"></select></th><th><select data-filter="famille"></select></th><th><select data-filter="libelle"></select></th><th><select data-filter="secteur"></select></th><th><select data-filter="prix"></select></th><th><select data-filter="barcode"></select></th><th></th><th><select data-filter="photo"></select></th>
      </tr>
      </thead>
      <tbody id="articlesBody"></tbody>
    </table>
  </section>
</main>
<script>
const STATE_KEY='generateur_etiquettes_state';
let articles=[];
const selected=new Set();
let timer=null;
let restoreState=null;
let sortKey='numero', sortDir='asc';
const columnFilters={};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function lireEtat(){
  try{return JSON.parse(sessionStorage.getItem(STATE_KEY)||'{}')||{}}catch{return {}}
}
function enregistrerEtat(){
  sessionStorage.setItem(STATE_KEY,JSON.stringify({
    activiteDs:filterSecteur.value,
    groupe:filterGroupe.value,
    recherche:articleSearch.value,
    selected:[...selected]
  }));
}
function restaurerSelection(){
  const etat=lireEtat();
  selected.clear();
  if(Array.isArray(etat.selected)) etat.selected.forEach(ref=>selected.add(String(ref)));
  restoreState=etat;
}
async function api(params){const q=new URLSearchParams(params);const r=await fetch('/api/articles?'+q,{credentials:'same-origin',cache:'no-store'});const p=await r.json().catch(()=>({}));if(r.status===401){location.href='/login';throw new Error('Session expirée')}if(!r.ok)throw new Error(p.error||'Erreur API');return p}
function fillSelect(el,values,desired){el.innerHTML='<option value="Tous">Tous</option>';for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}if(desired&&[...el.options].some(o=>o.value===desired))el.value=desired}
async function loadActivites(){try{status.textContent='Chargement des activités…';const p=await api({action:'secteurs'});fillSelect(filterSecteur,p.secteurs||[],restoreState?.activiteDs||'Tous');await loadGroupes(true)}catch(e){status.textContent='Erreur : '+e.message}}
async function loadGroupes(restoring=false){try{status.textContent='Chargement des groupes…';const p=await api({action:'groupes',activite_ds:filterSecteur.value});fillSelect(filterGroupe,p.groupes||[],restoring?(restoreState?.groupe||'Tous'):'Tous');if(restoring&&restoreState?.recherche)articleSearch.value=restoreState.recherche;await loadArticles();restoreState=null}catch(e){status.textContent='Erreur : '+e.message}}
async function loadArticles(){try{status.textContent='Chargement des articles…';const params={action:'articles',activite_ds:filterSecteur.value,groupe:filterGroupe.value};if(articleSearch.value.trim())params.q=articleSearch.value.trim();const p=await api(params);articles=Array.isArray(p.articles)?p.articles:[];render();status.textContent=articles.length+' article(s) affiché(s).';enregistrerEtat()}catch(e){articles=[];render();status.textContent='Erreur : '+e.message}}

function valeurColonne(a,key){return String(a?.[key]??'').trim()}
function articlesAffiches(){
  let rows=articles.filter(a=>Object.entries(columnFilters).every(([k,v])=>!v||valeurColonne(a,k)===v));
  rows=rows.slice().sort((a,b)=>{
    let av=valeurColonne(a,sortKey), bv=valeurColonne(b,sortKey);
    if(sortKey==='prix'){av=parseFloat(av.replace(',','.'))||0;bv=parseFloat(bv.replace(',','.'))||0;return (av-bv)*(sortDir==='asc'?1:-1)}
    return av.localeCompare(bv,'fr',{numeric:true,sensitivity:'base'})*(sortDir==='asc'?1:-1);
  });
  return rows;
}
function majFiltresColonnes(){
  document.querySelectorAll('[data-filter]').forEach(sel=>{
    const key=sel.dataset.filter, current=columnFilters[key]||'';
    const values=[...new Set(articles.map(a=>valeurColonne(a,key)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'}));
    sel.innerHTML='<option value="">Tous</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    if(values.includes(current)) sel.value=current; else {sel.value='';delete columnFilters[key]}
  });
}
function photoHtml(a){
  const nom=String(a.photo || '').trim();
  return nom
    ? `<div class="photo-cell">${esc(nom)}</div>`
    : `<span class="photo-missing">Aucune</span>`;
}
function render(){
  majFiltresColonnes();
  const rows=articlesAffiches();
  articlesBody.innerHTML=rows.map((a,i)=>`<tr data-i="${i}" class="${selected.has(a.numero)?'selected':''}"><td class="check-col"><input class="row-check" type="checkbox" data-ref="${esc(a.numero)}" ${selected.has(a.numero)?'checked':''}></td><td class="ref">${esc(a.numero)}</td><td>${esc(a.refFournisseur)||'<span class="muted">—</span>'}</td><td>${esc(a.groupe)||'—'}</td><td>${esc(a.famille)||'—'}</td><td>${esc(a.libelle)||'—'}</td><td>${esc(a.secteur)||'—'}</td><td class="price">${a.prix?esc(a.prix)+' €':'—'}</td><td class="barcode-text">${esc(a.barcode)||'—'}</td><td class="barcode-preview"><svg id="bc-${i}"></svg></td><td>${photoHtml(a)}</td></tr>`).join('');
  document.querySelectorAll('.row-check').forEach(cb=>cb.addEventListener('change',e=>{const ref=e.target.dataset.ref;e.target.checked?selected.add(ref):selected.delete(ref);enregistrerEtat();render()}));
  rows.forEach((a,i)=>{if(!a.barcode)return;try{const val=a.barcodeType==='EAN13'&&/^\d{13}$/.test(a.barcode)?a.barcode.slice(0,12):a.barcode;JsBarcode('#bc-'+i,val,{format:a.barcodeType||'CODE128',displayValue:false,height:30,width:1,margin:2})}catch{}});
  document.querySelectorAll('th[data-sort]').forEach(th=>{th.querySelector('.sort-mark')?.remove();if(th.dataset.sort===sortKey)th.insertAdjacentHTML('beforeend',`<span class="sort-mark">${sortDir==='asc'?'▲':'▼'}</span>`)});
  updateCount();
}
document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir='asc'}render()}));
document.querySelectorAll('[data-filter]').forEach(sel=>sel.addEventListener('change',()=>{const k=sel.dataset.filter;if(sel.value)columnFilters[k]=sel.value;else delete columnFilters[k];render()}));
function updateCount(){selectionCount.textContent=selected.size+' article'+(selected.size>1?'s':'')+' sélectionné'+(selected.size>1?'s':'');selectAll.checked=articles.length>0&&articles.every(a=>selected.has(a.numero));selectAll.indeterminate=articles.some(a=>selected.has(a.numero))&&!selectAll.checked}
filterSecteur.addEventListener('change',()=>{filterGroupe.value='Tous';enregistrerEtat();loadGroupes(false)});
filterGroupe.addEventListener('change',()=>{enregistrerEtat();loadArticles()});
refreshBtn.addEventListener('click',loadArticles);
articleSearch.addEventListener('input',()=>{enregistrerEtat();clearTimeout(timer);timer=setTimeout(loadArticles,300)});
selectAll.addEventListener('change',()=>{if(selectAll.checked)articles.forEach(a=>selected.add(a.numero));else articles.forEach(a=>selected.delete(a.numero));enregistrerEtat();render()});
clearSelectionBtn.addEventListener('click',()=>{selected.clear();enregistrerEtat();render()});
photoBtn.addEventListener('click',()=>{
  enregistrerEtat();
  sessionStorage.setItem('photos_articles_liste', JSON.stringify(articles));
  sessionStorage.setItem('photos_articles_contexte', JSON.stringify({activiteDs:filterSecteur.value,groupe:filterGroupe.value,recherche:articleSearch.value.trim()}));
  location.href='/generateur-etiquettes/photos.html';
});
previewBtn.addEventListener('click',()=>{const rows=articles.filter(a=>selected.has(a.numero));if(!rows.length){alert('Sélectionnez au moins un article.');return}enregistrerEtat();sessionStorage.setItem('etiquettes_selection',JSON.stringify(rows));window.open('/generateur-etiquettes/apercu.html','_blank')});
logoutBtn.addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}location.href='/login'});
restaurerSelection();
loadActivites();
</script>
</body></html>
