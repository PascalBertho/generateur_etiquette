<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu des étiquettes</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--ink:#1c2b3a;--ink-soft:#4a5c6e;--accent:#0f5f8c;--accent-2:#e8722a;--panel:#eef2f5;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--panel);color:var(--ink)}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.16)}
  .toolbar strong{margin-right:auto}
  .toolbar button{border:1px solid rgba(255,255,255,.5);border-radius:6px;background:#fff;color:var(--ink);padding:8px 13px;font-weight:700;cursor:pointer}
  .toolbar button.secondary{background:transparent;color:#fff}
  #message{padding:40px;text-align:center;color:var(--ink-soft)}
  #sheets-wrap{padding:20px}
  .sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 22px;padding:8mm 4mm;box-shadow:0 1px 8px rgba(20,40,60,.18);display:flex;flex-direction:column;align-items:center;gap:7mm}
  .page-label{align-self:flex-start;font-size:10px;color:var(--ink-soft);margin-bottom:2mm}
  .etq{width:150mm;height:39mm;border:.5mm solid var(--ink);display:flex;background:#fff;overflow:hidden}
  .col-photo{width:37mm;height:100%;border-right:.4mm solid var(--ink);display:flex;align-items:center;justify-content:center;padding:2mm}
  .col-photo img{max-width:100%;max-height:100%;object-fit:contain}.ph-empty{font-size:8px;color:#9aa8b3;text-align:center}
  .col-code{width:46mm;height:100%;border-right:.4mm solid var(--ink);display:flex;flex-direction:column}
  .barcode-box{flex:0 0 17mm;border-bottom:.3mm solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:.5mm}
  .barcode-box svg{max-width:100%;max-height:100%}
  .refds-box{flex:0 0 13mm;border-bottom:.3mm solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3mm;padding:0 1.5mm;overflow:hidden;line-height:1.25}
  .refds-box .lbl{font-size:9px;font-weight:700}.refds-box .val{font-size:14px;font-weight:700;letter-spacing:.3px}
  .reffour-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}.reffour-box .lbl{font-size:8px}.reffour-box .val{font-size:12px;font-weight:700}
  .col-info{flex:1;height:100%;display:flex;flex-direction:column}.top-row{flex:0 0 12mm;border-bottom:.3mm solid var(--ink);display:flex}
  .sector-box{flex:1;border-right:.3mm solid var(--ink);display:flex;align-items:center;gap:2mm;padding:0 2mm}.sector-box .icon{width:7mm;height:9mm;flex:0 0 auto;color:var(--accent-2)}.sector-code{font-size:15px;font-weight:800;letter-spacing:.5px}
  .remise-box{width:22mm;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent)}
  .libelle-row{flex:1;border-bottom:.3mm solid var(--ink);display:flex;align-items:center;padding:0 2.5mm;font-size:10.5px;font-weight:600;line-height:1.2;overflow:hidden}
  .price-row{flex:0 0 12mm;display:flex;align-items:center;justify-content:space-between;padding:0 2.5mm}.pvp-lbl{font-size:9px;font-weight:700}.pvp-lbl small{font-size:6.5px}.price-val{font-size:22px;font-weight:800;color:var(--accent-2)}
  body[data-label-format="liege"] .etq{width:140mm;height:30mm}body[data-label-format="liege"] .col-photo{width:34.5mm;padding:1.4mm}body[data-label-format="liege"] .col-code{width:42.9mm}body[data-label-format="liege"] .barcode-box{flex:0 0 12.8mm;padding:.3mm}body[data-label-format="liege"] .refds-box{flex:0 0 9.8mm;gap:.15mm;padding:0 1.2mm;line-height:1.15}body[data-label-format="liege"] .refds-box .lbl{font-size:7.2px}body[data-label-format="liege"] .refds-box .val{font-size:11px}body[data-label-format="liege"] .reffour-box{line-height:1.1}body[data-label-format="liege"] .reffour-box .lbl{font-size:6.5px}body[data-label-format="liege"] .reffour-box .val{font-size:9.5px}body[data-label-format="liege"] .top-row{flex:0 0 9.2mm}body[data-label-format="liege"] .sector-box{gap:1.2mm;padding:0 1.5mm}body[data-label-format="liege"] .sector-box .icon{width:5.5mm;height:7mm}body[data-label-format="liege"] .sector-code{font-size:11.5px}body[data-label-format="liege"] .remise-box{width:20.5mm;font-size:9px}body[data-label-format="liege"] .libelle-row{padding:0 2mm;font-size:8.4px;line-height:1.15}body[data-label-format="liege"] .price-row{flex:0 0 9.2mm;padding:0 2mm}body[data-label-format="liege"] .pvp-lbl{font-size:7.5px}body[data-label-format="liege"] .pvp-lbl small{font-size:5.5px}body[data-label-format="liege"] .price-val{font-size:17px}
  @page{size:210mm 297mm;margin:0}
  @media print{.toolbar{display:none!important}body{background:#fff}.sheet{box-shadow:none;margin:0;page-break-after:always}.page-label{display:none}#sheets-wrap{padding:0}}
</style>
</head>
<body>
<div class="toolbar">
  <strong id="title">Aperçu des étiquettes</strong>
  <button type="button" onclick="window.print()">Imprimer / Export PDF</button>
  <button type="button" class="secondary" onclick="window.close()">Fermer</button>
</div>
<div id="message">Préparation de l’aperçu…</div>
<div id="sheets-wrap"></div>
<script>
const LABELS_PER_PAGE = 6;
const SECTEUR_COLORS={"Cheminées":"#e40b22","Equipement":"#45ac3a","Ventilation":"#009fe3","Traitement d'eau":"#50bcbd","Accumulateur thermique":"#ff7610","Pompe à chaleur et climatisation":"#1d930c"};
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function normaliserTexte(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function batteryIconSvg(){return `<svg class="icon" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="0" width="12" height="4" rx="1.5" fill="currentColor"/><rect x="2" y="4" width="20" height="25" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10 L7 18 H11 L9.5 24 L16 15 H12 L13.5 10 Z" fill="currentColor"/></svg>`;}
function pictogrammeSecteurSvg(value){const cle=normaliserTexte(value).replace(/[^a-z0-9]/g,'');const base=c=>`<svg class="icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">${c}</svg>`;if(cle.includes('chem'))return base('<path d="M8 28h16V13H8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 13V7h10v6M16 26c-5-4 2-7-1-12 6 4 7 8 1 12z" fill="currentColor"/>');if(cle.includes('vent'))return base('<circle cx="16" cy="16" r="3" fill="currentColor"/><path d="M16 3c7 0 8 5 4 9-2 2-4 2-4 2M29 16c0 7-5 8-9 4-2-2-2-4-2-4M16 29c-7 0-8-5-4-9 2-2 4-2 4-2M3 16c0-7 5-8 9-4 2 2 4 2 4 2" fill="none" stroke="currentColor" stroke-width="2"/>');if(cle.includes('eau')||cle.includes('aqua'))return base('<path d="M16 3S7 14 7 21a9 9 0 0 0 18 0C25 14 16 3 16 3z" fill="none" stroke="currentColor" stroke-width="2"/>');if(cle.includes('pac'))return base('<path d="M5 8h22v16H5z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/>');if(cle.includes('equip'))return base('<path d="M7 27l5-5 3 3 10-10-4-4L11 21l-3-3-5 5z" fill="none" stroke="currentColor" stroke-width="2"/>');return batteryIconSvg();}
function buildLabel(l){const el=document.createElement('div');el.className='etq';el.innerHTML=`<div class="col-photo">${l.photo?`<img src="${l.photo}">`:'<div class="ph-empty">Pas de photo</div>'}</div><div class="col-code"><div class="barcode-box">${l.barcode?`<svg class="barcode-svg" data-value="${escapeHtml(l.barcode)}" data-type="${escapeHtml(l.barcodeType||'EAN13')}"></svg>`:''}</div><div class="refds-box"><div class="lbl">Réf. DETANDT-SIMON :</div><div class="val">${escapeHtml(l.refds)}</div></div><div class="reffour-box"><div class="lbl">Réf fournisseur :</div><div class="val">${escapeHtml(l.reffour)}</div></div></div><div class="col-info"><div class="top-row"><div class="sector-box">${l.secteurPhoto?`<img class="icon" src="${l.secteurPhoto}" style="object-fit:contain">`:pictogrammeSecteurSvg(l.groupeArticles||l.secteur)}<div class="sector-code">${escapeHtml(l.secteur)}</div></div><div class="remise-box">${escapeHtml(l.remise)}</div></div><div class="libelle-row">${escapeHtml(l.libelle)}</div><div class="price-row"><div class="pvp-lbl">PVP <small>HTVA :</small></div><div class="price-val" style="color:${SECTEUR_COLORS[l.secteur]||'var(--accent-2)'}">${l.prix?escapeHtml(l.prix)+' €':''}</div></div></div>`;return el;}
function render(){let labels=[];try{labels=JSON.parse(localStorage.getItem('generateurEtiquettes.labels')||'[]');}catch(_){}const format=localStorage.getItem('generateurEtiquettes.format')||'ghlin';document.body.dataset.labelFormat=format;document.getElementById('title').textContent=`Aperçu des étiquettes — ${format==='liege'?'Liège':'Ghlin'}`;const msg=document.getElementById('message');const wrap=document.getElementById('sheets-wrap');if(!labels.length){msg.textContent='Aucune étiquette à afficher. Revenez au générateur et ajoutez des articles.';return;}msg.remove();const pages=Math.ceil(labels.length/LABELS_PER_PAGE);for(let p=0;p<pages;p++){const sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML=`<div class="page-label">Page ${p+1} / ${pages}</div>`;labels.slice(p*LABELS_PER_PAGE,p*LABELS_PER_PAGE+LABELS_PER_PAGE).forEach(l=>sheet.appendChild(buildLabel(l)));wrap.appendChild(sheet);}document.querySelectorAll('.barcode-svg').forEach(svg=>{const value=svg.dataset.value||'';const type=svg.dataset.type||'EAN13';try{const opt=format==='liege'?{fontSize:8,height:24,width:1.1}:{fontSize:11,height:34,width:1.4};JsBarcode(svg,type==='EAN13'?value.slice(0,12):value,{format:type,displayValue:true,fontSize:opt.fontSize,height:opt.height,width:opt.width,margin:0});}catch(_){}});}
render();
</script>
</body>
</html>
