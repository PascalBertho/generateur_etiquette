<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aperçu des étiquettes</title><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f5;color:#17293a}.bar{position:sticky;top:0;background:#17293a;color:#fff;padding:12px 18px;display:flex;gap:10px;align-items:center;z-index:5}.bar strong{flex:1}.bar button{border:0;border-radius:6px;padding:8px 12px;cursor:pointer}.sheet{width:210mm;min-height:297mm;background:#fff;margin:16px auto;padding:8mm 4mm;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:7mm}.label{width:150mm;height:39mm;border:.5mm solid #17293a;display:grid;grid-template-columns:46mm 1fr;box-sizing:border-box;overflow:hidden}.left{border-right:.4mm solid #17293a;display:flex;flex-direction:column}.bc{height:17mm;border-bottom:.3mm solid #17293a;display:flex;align-items:center;justify-content:center}.bc svg{max-width:44mm;max-height:16mm}.refs{padding:1mm 2mm;font-size:9px;line-height:1.5}.refs b{font-size:11px}.right{display:grid;grid-template-rows:12mm 1fr 12mm}.top{border-bottom:.3mm solid #17293a;display:flex;align-items:center;justify-content:space-between;padding:0 2.5mm}.top .sector{font-weight:800}.top .group{font-size:9px;color:#50616f}.lib{border-bottom:.3mm solid #17293a;padding:2mm 2.5mm;font-size:10.5px;font-weight:600;display:flex;align-items:center}.price{display:flex;align-items:center;justify-content:flex-end;padding:0 3mm;font-size:22px;font-weight:800;color:#e8722a}@page{size:A4;margin:0}@media print{.bar{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always}body{background:#fff}}
</style></head><body><div class="bar"><strong id="title">Aperçu</strong><button onclick="window.print()">Imprimer / PDF</button><button onclick="window.close()">Fermer</button></div><div id="out"></div><script>
const items=JSON.parse(sessionStorage.getItem('etiquettes_selection')||'[]');title.textContent=`Aperçu — ${items.length} étiquette(s)`;const perPage=6;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
for(let p=0;p<Math.ceil(items.length/perPage);p++){const sh=document.createElement('div');sh.className='sheet';items.slice(p*perPage,p*perPage+perPage).forEach((a,j)=>{const i=p*perPage+j;const el=document.createElement('div');el.className='label';el.innerHTML=`<div class="left"><div class="bc"><svg id="bc${i}"></svg></div><div class="refs">Réf. DS : <b>${esc(a.numero)}</b><br>Réf. fournisseur : <b>${esc(a.refFournisseur)||'—'}</b><br>Famille : ${esc(a.famille)||'—'}</div></div><div class="right"><div class="top"><span class="sector">${esc(a.secteur)||esc(a.activiteDs)||'—'}</span><span class="group">${esc(a.groupe)||''}</span></div><div class="lib">${esc(a.libelle)||'—'}</div><div class="price">${a.prix?esc(a.prix)+' €':''}</div></div>`;sh.appendChild(el);});out.appendChild(sh)}
items.forEach((a,i)=>{if(!a.barcode)return;try{const v=a.barcodeType==='EAN13'&&/^\d{13}$/.test(a.barcode)?a.barcode.slice(0,12):a.barcode;JsBarcode('#bc'+i,v,{format:a.barcodeType||'CODE128',displayValue:true,height:34,width:1.3,fontSize:10,margin:0})}catch{}});
</script></body></html>
