<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f5;color:#1c2b3a}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;background:#1c2b3a;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .toolbar h1{font-size:16px;margin:0;margin-right:auto}
  .toolbar .info{font-size:12px;color:#c9d5dd}
  .btn{border:0;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-print{background:#e8722a;color:#fff}
  .btn-back{background:#fff;color:#0f5f8c}
  .btn-format{background:#2f4858;color:#fff;border:1px solid #6f8796}
  .btn-format:hover{background:#3b596b}
  #empty{max-width:760px;margin:40px auto;padding:25px;background:#fff;border-radius:10px;text-align:center}
  #sheets-wrap{padding:22px 0}
  .sheet{width:210mm;min-height:297mm;margin:0 auto 22px;background:#fff;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 7px rgba(0,0,0,.18)}
  body[data-format="140x30"] .sheet{padding:12mm 4mm;gap:4.5mm}
  body[data-format="150x39"] .sheet{padding:6mm 4mm;gap:2mm}
  .page-label{align-self:flex-start;font-size:10px;color:#617382;margin-bottom:2mm}

  /* ==========================================================
     MODELE LIEGE - configuration identique a l'ancienne app
     Format physique exact : 140 x 30 mm
     Colonnes : photo | codes/references | informations/prix
     ========================================================== */
  .etq{
    width:140mm;
    height:30mm;
    min-width:140mm;
    max-width:140mm;
    min-height:30mm;
    max-height:30mm;
    flex:0 0 30mm;
    border:.5mm solid #1c2b3a;
    display:flex;
    background:#fff;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }

  /* Colonne gauche : photo */
  .etq .col-photo{
    width:34.5mm;
    height:100%;
    flex:0 0 34.5mm;
    border-right:.4mm solid #1c2b3a;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.4mm;
    overflow:hidden;
  }
  .etq .col-photo img{max-width:100%;max-height:100%;object-fit:contain}
  .etq .ph-empty{font-size:7px;color:#9aa8b3;text-align:center}

  /* Colonne centrale : code-barres / ref DS / ref fournisseur */
  .etq .col-code{
    width:42.9mm;
    height:100%;
    flex:0 0 42.9mm;
    border-right:.4mm solid #1c2b3a;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .etq .barcode-box{
    flex:0 0 13.05mm;
    height:13.05mm;
    border-bottom:.3mm solid #1c2b3a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:.25mm;
  }
  .etq .barcode-box svg{max-width:100%;max-height:100%;display:block}
  .etq .refds-box{
    flex:0 0 10mm;
    height:10mm;
    border-bottom:.3mm solid #1c2b3a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.1mm;
    padding:0 1.1mm;
    overflow:hidden;
    line-height:1.1;
  }
  .etq .refds-box .lbl{font-size:7px;font-weight:700;color:#333;white-space:nowrap}
  .etq .refds-box .val{font-size:10.7px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .etq .reffour-box{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:1.05;
    overflow:hidden;
    padding:0 .8mm;
  }
  .etq .reffour-box .lbl{font-size:6.3px;color:#333;white-space:nowrap}
  .etq .reffour-box .val{font-size:9px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  /* Colonne droite : secteur/remise, libelle, prix */
  .etq .col-info{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
  .etq .top-row{
    flex:0 0 9.2mm;
    height:9.2mm;
    border-bottom:.3mm solid #1c2b3a;
    display:flex;
    overflow:hidden;
  }
  .etq .sector-box{
    flex:1 1 auto;
    min-width:0;
    border-right:.3mm solid #1c2b3a;
    display:flex;
    align-items:center;
    gap:1.2mm;
    padding:0 1.5mm;
    overflow:hidden;
  }
  .etq .sector-box .icon{width:5.5mm;height:7mm;flex:0 0 auto}
  .etq .sector-box img.icon{width:7mm!important;height:7mm!important;object-fit:contain;display:block}
  .etq .sector-code{font-size:11.2px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etq .remise-box{
    width:20.5mm;
    flex:0 0 20.5mm;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8.8px;
    font-weight:700;
    color:#0f5f8c;
    overflow:hidden;
    white-space:nowrap;
  }
  .etq .libelle-row{
    flex:1 1 auto;
    min-height:0;
    border-bottom:.3mm solid #1c2b3a;
    display:flex;
    align-items:center;
    padding:0 2mm;
    font-size:8.3px;
    font-weight:600;
    line-height:1.13;
    overflow:hidden;
  }
  .etq .price-row{
    flex:0 0 9.2mm;
    height:9.2mm;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2mm;
    padding:0 2mm;
    overflow:hidden;
  }
  .etq .pvp-lbl{font-size:7.3px;font-weight:700;color:#333;white-space:nowrap}
  .etq .pvp-lbl small{font-size:5.4px;font-weight:600}
  .etq .price-val{font-size:16.5px;font-weight:800;white-space:nowrap}

  /* ==========================================================
     MODELE GHLIN - repris de l'ancienne application
     Format physique exact : 150 x 39 mm
     Les dimensions internes sont conservees volontairement.
     ========================================================== */
  body[data-format="150x39"] .etq{
    width:150mm;
    height:39mm;
    min-width:150mm;

<body data-format="140x30">
<header class="toolbar">

  </div>

  <nav class="preview-nav" aria-label="Navigation principale">

    </a>
    <a href="/generateur-etiquettes/import-photos.html">

    </a>
    <a href="/generateur-etiquettes/" id="previewCartNav">
      <span class="nav-icon">🛒</span>
      <span>PANIER</span>
    </a>
    <a href="#" class="active">
      <span class="nav-icon">▤</span>
      <span>APERÇU ÉTIQUETTES</span>
    </a>
  </nav>
</header>

<div class="preview-actions">
  <button class="btn btn-format" id="formatBtn" type="button">Passer en 150 × 39 mm</button>
  <button class="btn btn-back" id="backBtn" type="button">Retour</button>
  <button class="btn btn-print" id="printBtn" type="button">Imprimer / PDF</button>
</div>
<main class="preview-layout">
  <aside class="preview-side">
    <h3>Paramètres</h3>
    <div class="preview-side-row">
      <span class="preview-side-label">Modèle</span>
      <span class="preview-side-value" id="sideFormat">Liège 140 × 30 mm</span>
    </div>
    <div class="preview-side-row">
      <span class="preview-side-label">Étiquettes par page</span>
      <span class="preview-side-value" id="sidePerPage">8</span>
    </div>
    <div class="preview-side-row">
      <span class="preview-side-label">Total étiquettes</span>
      <span class="preview-side-value" id="sideTotal">0</span>
    </div>
  </aside>
  <div id="sheets-wrap"></div>
</main>

<div class="preview-bottom">
  <button class="zoom-btn" id="zoomOutBtn" type="button">−</button>
  <span class="zoom-value" id="zoomValue">100%</span>
  <button class="zoom-btn" id="zoomInBtn" type="button">+</button>
</div>
<script>
const LABEL_FORMATS = {
  '140x30': { label:'Liège 140 × 30 mm', perPage:8 },
  '150x39': { label:'Ghlin 150 × 39 mm', perPage:7 }
};
let currentFormat='140x30';
const SECTEUR_COLORS = {
  "Cheminées":"#e40b22",
  "Equipement":"#45ac3a",
  "Ventilation":"#009fe3",
  "Traitement d'eau":"#50bcbd",
  "Accumulateur thermique":"#ff7610",
  "Pompe à chaleur et climatisation":"#1d930c"
};

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normaliserArticle(a){
  return {
    photo:a.photo || a.articles_photo || '',
    barcode:a.barcode || a.codeBarre || '',
    barcodeType:a.barcodeType || a.typeCodeBarre || (/^\d{13}$/.test(String(a.barcode||''))?'EAN13':'CODE128'),
    refds:a.refds || a.numero || a.dsReference || '',
    reffour:a.reffour || a.refFournisseur || a.supplierReference || '',
    secteur:a.secteur || a.activiteDs || a.family || '',
    remise:a.remise || a.codeRemise || '',
    libelle:a.libelle || a.label || a.nom || '',
    prix:a.prix || a.price || '',
    secteurPhoto:a.secteurPhoto || ''
  };
}
function secteurPictoHtml(l){
  // Une image explicite reste prioritaire si elle est fournie avec l'article.
  if(l.secteurPhoto){
    return `<img class="icon sector-picto" src="${esc(l.secteurPhoto)}" alt="Picto ${esc(l.secteur)}">`;
  }

  const secteur=String(l.secteur || '').trim();
  if(!secteur) return '';

  // Le bucket pictos_secteurs est prive : l'image est servie par l'API Vercel.
  // L'API retrouve image_path dans la table pictos_secteurs a partir de activite_ds.
  const src='/api/pictos-secteurs?activite=' + encodeURIComponent(secteur);
  return `<img class="icon sector-picto"
    src="${esc(src)}"
    alt="Picto ${esc(secteur)}"
    onerror="this.onerror=null;this.style.display='none'">`;
}

function formatPrix(v){
  if(v===null||v===undefined||v==='') return '';
  const n=Number(String(v).replace(',','.'));
  return Number.isFinite(n) ? n.toFixed(2).replace('.',',')+' €' : esc(v)+' €';
}
function photoUrl(l){
  const photo=String(l.photo || '').trim();
  if(!photo) return '';

  // Les photos choisies manuellement dans l'ancien générateur sont déjà
  // des data: URL. Une URL http(s)/blob peut également être utilisée telle quelle.
  if(/^(data:|blob:|https?:\/\/)/i.test(photo)) return photo;

  // Dans l'application Supabase, `photo` contient le nom du fichier du bucket
  // (ex. FU01150.png). Le bucket est privé : on passe par la route serveur
  // authentifiée qui retrouve l'image grâce à la référence DS.
  const ref=String(l.refds || '').trim();
  if(ref) return '/api/articles/photos?ref=' + encodeURIComponent(ref);

  return '';
}
function buildLabelEl(raw){
  const l=normaliserArticle(raw);
  const el=document.createElement('div');
  el.className='etq';
  const priceColor=SECTEUR_COLORS[l.secteur] || '#e8722a';
  el.innerHTML=`
    <div class="col-photo">
      ${photoUrl(l)?`<img src="${esc(photoUrl(l))}" alt="Photo ${esc(l.refds)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="ph-empty" style="display:none">Photo indisponible</div>`:`<div class="ph-empty">Pas de photo</div>`}
    </div>
    <div class="col-code">
      <div class="barcode-box">
        ${l.barcode?`<svg class="barcode-svg" data-value="${esc(l.barcode)}" data-type="${esc(l.barcodeType)}"></svg>`:''}
      </div>
      <div class="refds-box">
        <div class="lbl">Réf. DETANDT-SIMON :</div>
        <div class="val">${esc(l.refds)}</div>
      </div>
      <div class="reffour-box">
        <div class="lbl">Réf fournisseur :</div>
        <div class="val">${esc(l.reffour)}</div>
      </div>
    </div>
    <div class="col-info">
      <div class="top-row">
        <div class="sector-box">
          ${secteurPictoHtml(l)}
          <div class="sector-code">${esc(l.secteur)}</div>
        </div>
        <div class="remise-box">${esc(l.remise)}</div>
      </div>
      <div class="libelle-row">${esc(l.libelle)}</div>
      <div class="price-row">
        <div class="pvp-lbl">PVP <small>HTVA :</small></div>
        <div class="price-val" style="color:${priceColor}">${formatPrix(l.prix)}</div>
      </div>
    </div>`;
  return el;
}
function renderBarcodes(){
  document.querySelectorAll('.barcode-svg').forEach(svg=>{
    const value=svg.dataset.value||'';
    const type=svg.dataset.type||'CODE128';
    if(!value) return;
    try{
      const common=currentFormat==='150x39'
        ? {displayValue:true,fontSize:11,height:34,margin:0,width:1.4}
        : {displayValue:true,fontSize:8,height:24,margin:0,width:1.05};
      if(type==='EAN13' && /^\d{12,13}$/.test(value)){
        JsBarcode(svg,value.slice(0,12),{...common,format:'EAN13'});
      } else {
        JsBarcode(svg,value,{...common,format:type});
      }
    }catch(e){
      svg.replaceWith(document.createTextNode(value));
    }
  });
}
function lireSelection(){
  const key='etiquettes_selection';
  const sources=[];

  // 1. Stockage de l'onglet d'aperçu.
  try{sources.push(sessionStorage.getItem(key));}catch(e){}

  // 2. Stockage de la fenêtre qui a ouvert l'aperçu.
  //    C'est important en PWA / certains navigateurs où sessionStorage
  //    n'est pas recopié automatiquement dans le nouvel onglet.
  try{
    if(window.opener && !window.opener.closed && window.opener.location.origin===location.origin){
      sources.push(window.opener.sessionStorage.getItem(key));
    }
  }catch(e){}

  // 3. Secours si une version de l'application utilise localStorage.
  try{sources.push(localStorage.getItem(key));}catch(e){}

  for(const raw of sources){
    if(!raw) continue;
    try{
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }catch(e){}
  }
  return [];
}

function render(){
  const wrap=document.getElementById('sheets-wrap');
  const rows=lireSelection();
  const cfg=LABEL_FORMATS[currentFormat];
  document.body.dataset.format=currentFormat;
  document.getElementById('previewTitle').textContent='Aperçu des étiquettes';
  document.getElementById('previewSubtitle').textContent='Modèle '+cfg.label;
  document.getElementById('sideFormat').textContent=cfg.label;
  document.getElementById('sidePerPage').textContent=cfg.perPage;
  document.getElementById('sideTotal').textContent=rows.length;
  document.getElementById('formatBtn').textContent=currentFormat==='140x30' ? 'Passer en 150 × 39 mm' : 'Passer en 140 × 30 mm';
  wrap.innerHTML='';
  document.getElementById('countInfo').textContent=rows.length+' étiquette'+(rows.length>1?'s':'');
  if(!rows.length){
    wrap.innerHTML=`<div id="empty" style="margin:40px auto;max-width:760px;padding:24px;background:#fff;border:1px solid #d7e0e7;border-radius:10px;text-align:center;color:#445668">
      <strong style="display:block;color:#1c2b3a;margin-bottom:8px">Aucune donnée reçue par l'aperçu.</strong>
      Revenez à la liste des articles, sélectionnez au moins un article puis cliquez à nouveau sur <b>Aperçu</b>.<br>
      <small style="display:block;margin-top:10px">La page d'aperçu cherche maintenant la sélection dans l'onglet courant et dans la fenêtre d'origine.</small>
    </div>`;
    return;
  }
  const pages=Math.ceil(rows.length/cfg.perPage);
  for(let p=0;p<pages;p++){
    const sheet=document.createElement('section');
    sheet.className='sheet';
    const subset=rows.slice(p*cfg.perPage,p*cfg.perPage+cfg.perPage);
    sheet.innerHTML=`<div class="page-label">Page ${p+1} / ${pages} — ${subset.length} étiquette(s)</div>`;
    subset.forEach(row=>sheet.appendChild(buildLabelEl(row)));
    wrap.appendChild(sheet);
  }
  renderBarcodes();
}
document.getElementById('formatBtn').addEventListener('click',()=>{
  currentFormat=currentFormat==='140x30' ? '150x39' : '140x30';
  try{localStorage.setItem('etiquettes_format',currentFormat);}catch(e){}
  render();
});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.getElementById('backBtn').addEventListener('click',()=>{
  if(history.length>1) history.back(); else location.href='/generateur-etiquettes/';
});
try{
  const saved=localStorage.getItem('etiquettes_format');
  if(LABEL_FORMATS[saved]) currentFormat=saved;
}catch(e){}

let previewZoom=100;
function applyPreviewZoom(){
  document.body.classList.remove('preview-zoom-80','preview-zoom-90','preview-zoom-110');
  if(previewZoom!==100) document.body.classList.add('preview-zoom-'+previewZoom);
  document.getElementById('zoomValue').textContent=previewZoom+'%';
}
document.getElementById('zoomOutBtn')?.addEventListener('click',()=>{
  previewZoom=Math.max(80,previewZoom-10);
  applyPreviewZoom();
});
document.getElementById('zoomInBtn')?.addEventListener('click',()=>{
  previewZoom=Math.min(110,previewZoom+10);
  applyPreviewZoom();
});
applyPreviewZoom();

render();
</script>
